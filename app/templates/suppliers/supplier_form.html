{% extends 'base.html' %}
{% block title %}{{ 'Edit' if supplier else 'Add' }} Supplier — YourShop{% endblock %}
{% block topbar_title %}{{ '✏️ Edit' if supplier else '＋ Add' }} Supplier{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;">
    <form method="POST">
        <div class="form-row">
            <div class="form-group"><label class="form-label">Supplier Name *</label>
                <input type="text" name="name" class="form-control" value="{{ supplier.name if supplier else '' }}"
                    required />
            </div>
            <div class="form-group"><label class="form-label">Contact Person</label>
                <input type="text" name="contact_person" class="form-control"
                    value="{{ supplier.contact_person if supplier else '' }}" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}" />
            </div>
            <div class="form-group"><label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                    value="{{ supplier.email if supplier else '' }}" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">GST No</label>
                <input type="text" name="gst_no" class="form-control"
                    value="{{ supplier.gst_no if supplier else '' }}" />
            </div>
        </div>
        <div class="form-group"><label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ supplier.address if supplier else '' }}</textarea>
        </div>
        <div style="display:flex;gap:12px;margin-top:8px;">
            <button type="submit" class="btn btn-primary btn-lg">{{ '💾 Save' if supplier else '＋ Add Supplier'
                }}</button>
            <a href="{{ url_for('suppliers.index') }}" class="btn btn-secondary btn-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
