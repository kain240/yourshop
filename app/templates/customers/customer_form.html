{% extends 'base.html' %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer — YourShop{% endblock %}
{% block topbar_title %}{{ '✏️ Edit' if customer else '＋ Add' }} Customer{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;">
    <form method="POST">
        <div class="form-row">
            <div class="form-group"><label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control" value="{{ customer.name if customer else '' }}"
                    required />
            </div>
            <div class="form-group"><label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}"
                    placeholder="9876543210" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                    value="{{ customer.email if customer else '' }}" />
            </div>
            <div class="form-group"><label class="form-label">Credit Limit (₹)</label>
                <input type="number" name="credit_limit" class="form-control" step="0.01"
                    value="{{ customer.credit_limit if customer else 0 }}" />
            </div>
        </div>
        <div class="form-group"><label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
        </div>
        <div style="display:flex;gap:12px;margin-top:8px;">
            <button type="submit" class="btn btn-primary btn-lg">{{ '💾 Save' if customer else '＋ Add Customer'
                }}</button>
            <a href="{{ url_for('customers.index') }}" class="btn btn-secondary btn-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
